<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="270" viewBox="0 0 1100 270" role="img" aria-labelledby="title description">
  <title id="title">Implemented batch-serving path</title>
  <desc id="description">NYC TLC Parquet passes through silver validation and lineage, point-in-time gold features, model evaluation and promotion gates, MLflow, FastAPI on Kubernetes, and acknowledged Redpanda publication. FastAPI metrics feed Prometheus and Grafana. Airflow orchestrates batch work; static serving bypasses Redis.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1100" height="270" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="24" y="34" font-size="21" font-weight="700" fill="#0f172a">Batch training → online serving</text>
    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M156,100 H174"/><path d="M308,100 H326"/><path d="M460,100 H478"/>
      <path d="M612,100 H630"/><path d="M764,100 H782"/><path d="M916,100 H934"/>
      <path d="M850,130 V183"/><path d="M916,215 H934"/>
    </g>
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5">
      <rect x="24" y="70" width="132" height="60" rx="8"/>
      <rect x="176" y="70" width="132" height="60" rx="8"/>
      <rect x="328" y="70" width="132" height="60" rx="8"/>
      <rect x="480" y="70" width="132" height="60" rx="8"/>
      <rect x="632" y="70" width="132" height="60" rx="8"/>
      <rect x="784" y="70" width="132" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
      <rect x="936" y="70" width="132" height="60" rx="8"/>
      <rect x="784" y="185" width="132" height="60" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
      <rect x="936" y="185" width="132" height="60" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    </g>
    <g text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">
      <text x="90" y="94">TLC Parquet</text><text x="242" y="94">Silver</text>
      <text x="394" y="94">Gold</text><text x="546" y="94">Evaluate + gate</text>
      <text x="698" y="94">MLflow</text><text x="850" y="94">FastAPI</text>
      <text x="1002" y="94">Redpanda</text>
      <text x="850" y="209">Prometheus</text><text x="1002" y="209">Grafana</text>
    </g>
    <g text-anchor="middle" font-size="12" fill="#475569">
      <text x="90" y="114">Public trip data</text><text x="242" y="114">Validation · lineage</text>
      <text x="394" y="114">Point-in-time features</text><text x="546" y="114">3 model candidates</text>
      <text x="698" y="114">Approved artifact</text><text x="850" y="114">Kubernetes</text>
      <text x="1002" y="114">Ack before HTTP 200</text>
      <text x="850" y="229">Serving metrics</text><text x="1002" y="229">Dashboards</text>
    </g>
    <g font-size="14" fill="#475569">
      <text x="862" y="163">metrics</text>
      <text x="24" y="198">Airflow orchestrates ingestion, features and training.</text>
      <text x="24" y="223">Static serving bypasses Redis; live feature production is future work.</text>
    </g>
  </g>
</svg>
