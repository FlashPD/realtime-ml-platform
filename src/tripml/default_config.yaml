training:
  train_months: ["2024-01", "2024-02", "2024-03"]
  holdout_month: "2024-04"
  target: trip_duration_seconds
  model:
    objective: regression_l1
    num_leaves: 63
    learning_rate: 0.05
    n_estimators: 800
    seed: 42

promotion_gate:
  min_mae_improvement_vs_baseline_pct: 15.0
  min_mae_improvement_vs_production_pct: 1.0
  max_bucket_calibration_error_pct: 10.0
  max_inference_p95_ms: 5.0

streaming:
  short_window_seconds: 900
  long_window_seconds: 3600
  allowed_lateness_seconds: 300
  feature_ttl_seconds: 7200

serving:
  feature_staleness_limit_seconds: 600
  p95_latency_objective_ms: 50.0

ingestion:
  data_root: data
  source_base_url: https://d37ci6vzurychx.cloudfront.net/trip-data
  max_partition_violation_rate: 0.10
  batch_size: 65536
  download_timeout_seconds: 120.0
