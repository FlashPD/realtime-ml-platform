name: Quality

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:8.8.0-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check . && python -m ruff format --check .
      - name: Type check
        run: python -m mypy src
      - name: Test
        env:
          TRIPML_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: python -m pytest
      - name: Validate Helm chart
        run: make helm-lint
