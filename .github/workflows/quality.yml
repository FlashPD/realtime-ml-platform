name: Quality

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: tripml_test
          POSTGRES_USER: tripml_test
          POSTGRES_PASSWORD: tripml_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripml_test -d tripml_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.8.0-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check . && python -m ruff format --check .
      - name: Type check
        run: python -m mypy src
      - name: Validate Helm chart
        run: make helm-lint
      - name: Start disposable Redpanda
        run: |
          docker run -d --name tripml-ci-redpanda -p 127.0.0.1:19092:19092 \
            docker.redpanda.com/redpandadata/redpanda:v26.2.2 \
            redpanda start --mode dev-container --smp 1 --memory 512M \
            --reserve-memory 0M --overprovisioned --check=false \
            --kafka-addr 0.0.0.0:19092 --advertise-kafka-addr 127.0.0.1:19092
          for attempt in {1..30}; do
            if docker exec tripml-ci-redpanda rpk cluster health; then
              exit 0
            fi
            echo "Waiting for Redpanda (${attempt}/30)"
            sleep 2
          done
          docker logs tripml-ci-redpanda
          exit 1
      - name: Test
        env:
          TRIPML_TEST_DATABASE_URL: postgresql://tripml_test:tripml_ci_only@127.0.0.1:5432/tripml_test
          TRIPML_TEST_REDIS_URL: redis://127.0.0.1:6379/15
          TRIPML_TEST_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:19092
        run: python -m pytest
      - name: Broker diagnostics
        if: failure()
        run: docker logs tripml-ci-redpanda || true
      - name: Remove disposable Redpanda
        if: always()
        run: docker rm -f tripml-ci-redpanda || true
