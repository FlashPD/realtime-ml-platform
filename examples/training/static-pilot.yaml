# Isolated local static-model publication using the January / February pilot split.
# This does not satisfy the planned January-March / April release evaluation.
training:
  train_months: ["2024-01"]
  holdout_month: "2024-02"
  artifact_root: artifacts/training
  model:
    objective: regression_l1
    num_leaves: 63
    learning_rate: 0.05
    n_estimators: 800
    seed: 42

promotion_gate:
  min_mae_improvement_vs_baseline_pct: 15.0
  min_mae_improvement_vs_production_pct: 1.0
  max_bucket_calibration_error_pct: 10.0
  max_inference_p95_ms: 5.0

features:
  duckdb_memory_limit: 2GB
  duckdb_max_temp_directory_size: 8GB
  duckdb_threads: 2

ingestion:
  data_root: data
  max_partition_violation_rate: 0.10

tracking:
  candidate_role: static
  tracking_uri: sqlite:///artifacts/mlflow/static-pilot/mlflow.db
  local_artifact_root: artifacts/mlflow/static-pilot/runs
  experiment_name: tripml-static-pilot
  registered_model_name: tripml-trip-duration-static-pilot
  production_alias: production
