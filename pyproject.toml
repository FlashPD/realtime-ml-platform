[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tripml"
version = "0.1.0"
description = "A reproducible real-time ML platform built on NYC taxi trip data"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Pushyanth" }]
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.3.5,<4",
  "pyarrow>=25.0.1,<26",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
benchmark = [
  "httpx>=0.28,<1",
]
orchestration = [
  "apache-airflow-task-sdk==1.3.1",
]
transformation = [
  "dbt-duckdb>=1.11,<2",
]
training = [
  "lightgbm>=4.7,<5",
  "numpy>=2,<3",
]
tracking = [
  "mlflow==3.16.1",
]
serving = [
  "tripml[training,tracking]",
  "fastapi>=0.136.3,<1",
  "uvicorn>=0.53,<1",
  "prometheus-client>=0.24,<1",
  "redis>=6.4,<7",
  "confluent-kafka>=2.15,<3",
]
dev = [
  "tripml[serving]",
  "httpx>=0.28,<1",
  "apache-airflow-task-sdk==1.3.1",
  "matplotlib>=3.10,<4",
  "dbt-duckdb>=1.11,<2",
  "lightgbm>=4.7,<5",
  "mlflow==3.16.1",
  "numpy>=2,<3",
  "mypy>=1.14,<2",
  "pre-commit>=4.0,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
tripml = "tripml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tripml"]

[tool.hatch.build.targets.sdist]
include = [
  "/dags",
  "/examples/benchmark",
  "/src/tripml/dbt",
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=tripml",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=90",
]
testpaths = ["tests"]
markers = [
  "integration: tests requiring external services",
  "e2e: tests requiring a local Kubernetes cluster",
]

[tool.coverage.run]
branch = true
source = ["tripml"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PT",
  "PTH",
  "RUF",
  "SIM",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tripml"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lightgbm", "lightgbm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mlflow", "mlflow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["confluent_kafka", "confluent_kafka.*"]
ignore_missing_imports = true
