apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tripml.fullname" . }}-test-postgresql
  labels:
    {{- include "tripml.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-postgresql
    tripml.io/test: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: postgresql
      image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
      imagePullPolicy: {{ .Values.global.imagePullPolicy }}
      command: ["pg_isready"]
      args:
        - --host={{ include "tripml.fullname" . }}-postgresql
        - --username={{ .Values.postgresql.username }}
        - --dbname={{ .Values.postgresql.database }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        runAsNonRoot: true
        runAsUser: 999
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tripml.fullname" . }}-test-redis
  labels:
    {{- include "tripml.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-redis
    tripml.io/test: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: redis
      image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
      imagePullPolicy: {{ .Values.global.imagePullPolicy }}
      command: ["/bin/sh", "-ec"]
      args:
        - |
          redis-cli --no-auth-warning \
            -h {{ include "tripml.fullname" . }}-redis \
            -a "${REDIS_PASSWORD}" ping | grep -q PONG
      env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.credentialsSecret }}
              key: redis-password
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        runAsNonRoot: true
        runAsUser: 999
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tripml.fullname" . }}-test-platform-services
  labels:
    {{- include "tripml.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-platform-services
    tripml.io/test: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: "{{ .Values.redpanda.image.repository }}:{{ .Values.redpanda.image.tag }}"
      imagePullPolicy: {{ .Values.global.imagePullPolicy }}
      command: ["/bin/sh", "-ec"]
      args:
        - |
          broker="{{ include "tripml.fullname" . }}-redpanda:9092"
          admin="{{ include "tripml.fullname" . }}-redpanda:9644"
          topic="tripml.helm-smoke"
          rpk cluster health --exit-when-healthy \
            -X brokers="${broker}" \
            -X admin.hosts="${admin}"
          curl --fail --silent "http://{{ include "tripml.fullname" . }}-redpanda:8081/subjects" >/dev/null
          curl --fail --silent "http://{{ include "tripml.fullname" . }}-minio:9000/minio/health/ready" >/dev/null
          rpk topic delete "${topic}" -X brokers="${broker}" >/dev/null 2>&1 || true
          rpk topic create "${topic}" -X brokers="${broker}"
          printf 'platform-ready\n' | rpk topic produce "${topic}" -X brokers="${broker}"
          consumed="$(rpk topic consume "${topic}" --num 1 --format '%v' -X brokers="${broker}")"
          test "${consumed}" = "platform-ready"
          rpk topic delete "${topic}" -X brokers="${broker}"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        runAsNonRoot: true
        runAsUser: 101
